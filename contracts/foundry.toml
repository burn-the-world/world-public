[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Local composed state-machine test ceiling; not a chain block or transaction gas limit.
gas_limit = 1000000000000
verbosity = 3
ast = true
extra_output = ["storageLayout"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./test/fixtures/resistance" }
]

[profile.default.fuzz]
runs = 256
seed = "0x000000000000000000000000000000000000000000000000000000574f524c44"
